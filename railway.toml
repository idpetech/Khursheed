# Secrets belong in Railway service variables, not in this file.
# Railway does not create volumes from this file. In the service, add a volume
# mounted at /data. The image stores khursheed.db and the last brief there.
# Set TZ if the morning brief should use a clock other than America/New_York.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
