[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "khursheed-enaam"
version = "0.1.0"
description = "Enaam - Chief of Staff AI System"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Khursheed Project"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11", 
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
enaam = "enaam.run:main"
enaam-server = "enaam.mcp_server:main"

[project.urls]
Homepage = "https://github.com/haseebtoor/khursheed"
Repository = "https://github.com/haseebtoor/khursheed"

[tool.setuptools]
packages = ["enaam", "enaam.core", "enaam.mcp", "enaam.integrations", "enaam.skills", "enaam.legacy"]

[tool.setuptools.package-data]
enaam = ["*.json", "*.yaml", "*.yml"]

[tool.ruff]
target-version = "py310"
line-length = 120
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # do not perform function call in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**/*.py" = ["TID252"]  # Allow relative imports in tests

[tool.ruff.isort]
known-first-party = ["enaam"]
force-single-line = false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true